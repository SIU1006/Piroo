name: CI Pipeline

concurrency: # cancel stale PR if push twice quickly
  group: ${{ github.workflow }}-${{ github.ref }} # workflow name & branch/PR ref
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'terraform/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'terraform/**'

jobs:
  helm-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Helm
      uses: azure/setup-helm@v4
      with:
        version: v3.16.4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Lint chart
      run: helm lint k8s

    - name: Install YAML validator
      run: python -m pip install PyYAML==6.0.3

    - name: Verify rendered monitoring in all overlays
      run: |
        for overlay in dev staging prod; do
          receiver=slack
          if [ "$overlay" = dev ]; then receiver=local; fi
          out="$RUNNER_TEMP/monitoring/$overlay"
          helm template asyncvtp k8s --namespace monitoring-demo -f "k8s/values-$overlay.yaml" |
            python monitoring/validate_render.py --output-dir "$out" --receiver "$receiver" --namespace monitoring-demo
          mkdir -p "$out/rules"
          cp "$out/asyncvtp.rules.yml" "$out/rules/asyncvtp.rules.yml"
          docker run --rm --mount "type=bind,source=$out,target=/config,readonly" \
            --mount "type=bind,source=$out/rules,target=/etc/prometheus/rules,readonly" \
            --entrypoint promtool prom/prometheus:v3.8.1 check config /config/prometheus.yml
          docker run --rm --mount "type=bind,source=$out/rules,target=/rules,readonly" \
            --entrypoint promtool prom/prometheus:v3.8.1 check rules /rules/asyncvtp.rules.yml
          docker run --rm --mount "type=bind,source=$out,target=/rules,readonly" \
            --entrypoint amtool prom/alertmanager:v0.28.1 check-config /rules/alertmanager.yml
        done
        cp monitoring/alerts.test.yml "$RUNNER_TEMP/monitoring/dev/alerts.test.yml"
        docker run --rm --mount "type=bind,source=$RUNNER_TEMP/monitoring/dev,target=/rules,readonly" \
          --entrypoint promtool prom/prometheus:v3.8.1 test rules /rules/alerts.test.yml

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip' # store dependencies in cache to speed up future runs

    - name: Install dependencies
      run: pip install -r requirements-dev.txt

    - name: Install ffmpeg for media tests
      run: sudo apt-get update && sudo apt-get install -y ffmpeg

    - name: Lint
      run: ruff check . --fix

    - name: Run tests
      env:
        BROKER_URL: redis://redis-service:6379/0
        WHISPER_URL: http://whisper-service:3000
        OLLAMA_HOST: http://ollama-service:11434
        LLM_MODEL: llama3.2
      run: python -m pytest tests/ -v

  model-ci:
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 20

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: pip install -r requirements-dev.txt

    - name: Check fixed eval set is committed
      run: |
        if [ ! -f model_eval/eval_data/manifest.json ]; then
          echo "::error::model_eval/eval_data/manifest.json is missing. Run 'python model_eval/prepare_eval_set.py' locally and commit model_eval/eval_data/ first."
          exit 1
        fi

    - name: WER regression gate
      working-directory: model_eval
      run: python check_regression.py

  build-check: # before actual pushing
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'pull_request'
    timeout-minutes: 20 # default Github timeout is 6 hours!

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build FastAPI/Celery image (no push)
      uses: docker/build-push-action@v5
      with:
        context: .
        file: Dockerfile
        push: false
        tags: fastapi:pr-check
        cache-from: type=gha,scope=fastapi
        # no cache-to here — PR builds shouldn't overwrite main's cache

    - name: Build Whisper image (no push)
      uses: docker/build-push-action@v5
      with:
        context: .
        file: Dockerfile.inference
        push: false
        tags: whisper:pr-check
        build-args: |
          WHISPER_MODEL_SIZE=base
        cache-from: type=gha,scope=whisper

  build:
    runs-on: ubuntu-latest
    needs: [test, model-ci]    # only build if tests pass AND the model hasn't regressed
    if: github.event_name == 'push' # only push images after code lands on main
    timeout-minutes: 20
    permissions:
      contents: write
      packages: write

    steps:
    - name: Set lowercase repository owner
      run: echo "GH_USERNAME=${OWNER,,}" >> "$GITHUB_ENV"
      env:
        OWNER: ${{ github.repository_owner }}


    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Resolve production model size
      id: model-size
      run: echo "size=$(python model_eval/get_production_size.py)" >> "$GITHUB_OUTPUT"

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }} # from github

    - name: Set up Docker Buildx # save/load build cache to speed up future builds
      uses: docker/setup-buildx-action@v3

    - name: Build and push FastAPI/Celery image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: Dockerfile
        push: true
        tags: |
          ghcr.io/${{ env.GH_USERNAME }}/fastapi:latest
          ghcr.io/${{ env.GH_USERNAME }}/celery:latest
          ghcr.io/${{ env.GH_USERNAME }}/fastapi:${{ github.sha }}
          ghcr.io/${{ env.GH_USERNAME }}/celery:${{ github.sha }}
        cache-from: type=gha,scope=fastapi # Read previous image layers from GHA cache
        cache-to: type=gha,mode=max,scope=fastapi # Buildx recognizes unchanged layer's hash and restores from GHA cache, no need reinstalling ML dependencies


    - name: Build and push Whisper image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: Dockerfile.inference
        push: true
        tags: |
          ghcr.io/${{ env.GH_USERNAME }}/whisper:latest
          ghcr.io/${{ env.GH_USERNAME }}/whisper:${{ steps.model-size.outputs.size }}
          ghcr.io/${{ env.GH_USERNAME }}/whisper:${{ github.sha }}
        build-args: |
          WHISPER_MODEL_SIZE=${{ steps.model-size.outputs.size }}
        cache-from: type=gha,scope=whisper-${{ steps.model-size.outputs.size }}
        cache-to: type=gha,mode=max,scope=whisper-${{ steps.model-size.outputs.size }}

    - name: Bump staging image tags to this commit
      run: |
        SHA="${{ github.sha }}"
        sed -i "s|tag: \".*\" *# staging-auto|tag: \"${SHA}\"  # staging-auto|g" k8s/values-staging.yaml
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add k8s/values-staging.yaml
        if git diff --cached --quiet; then
          echo "No tag change - skipping commit"
        else
          git commit -m "chore(staging): bump image tags to ${SHA} [skip ci]"
          git push
        fi
