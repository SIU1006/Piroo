name: CI Pipeline

on:
  push:
    branches: [main]
    paths-ignore: # Changes to these files never affect images or tests - skip CI
      - '**.md'
      - 'docs/**'
      - 'static/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'static/**'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: pip install -r requirements-dev.txt

    - name: Run tests
      env:
        BROKER_URL: redis://redis-service:6379/0
        WHISPER_URL: http://whisper-service:3000
        OLLAMA_HOST: http://ollama-service:11434
        LLM_MODEL: llama3.2
      run: python -m pytest tests/ -v

  build:
    runs-on: ubuntu-latest
    needs: test    # only build if tests pass !!!
    permissions:
      contents: read
      packages: write
    env:
      REPO_LOWER: siu1006/video2text-pipeline

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }} # from github

    - name: Build and push FastAPI image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: Dockerfile
        push: true
        tags: ghcr.io/siu1006/fastapi:latest

    - name: Build and push Celery image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: Dockerfile
        push: true
        tags: ghcr.io/siu1006/celery:latest

    - name: Build and push Whisper image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: Dockerfile.inference
        push: true
        tags: ghcr.io/siu1006/whisper:latest