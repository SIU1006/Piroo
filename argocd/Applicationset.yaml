# Manage staging + prod with ArgoCD

apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: asyncvtp
  namespace: argocd
spec:
  generators:
    - list:
        elements:
          - env: staging
            namespace: asyncvtp-staging
            valuesFile: values-staging.yaml
          - env: prod
            namespace: asyncvtp-prod
            valuesFile: values-prod.yaml
  template:
    metadata:
      name: 'asyncvtp-{{env}}'
    spec:
      project: default
      source:
        repoURL: https://github.com/SIU1006/Piroo.git
        targetRevision: main
        path: k8s
        helm:
          valueFiles:
            - values.yaml
            - '{{valuesFile}}'
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{namespace}}'
      ignoreDifferences:
        # staging and prod deploy the same chart into one cluster. The external
        # metrics APIService is a cluster-singleton (one v1beta1.external.metrics.k8s.io
        # per cluster), so the two apps inevitably point it at their own adapter and
        # its tracking annotation differs. Ignore the whole resource so it doesn't
        # ping-pong into a permanent OutOfSync. (RBAC is already namespaced/suffixed
        # per release in the chart.)
        - group: apiregistration.k8s.io
          kind: APIService
          jqPathExpressions:
            - '.'
      syncPolicy:
        automated:
          prune: true    # remove resources that were deleted from the chart
          selfHeal: true  # revert manual kubectl edits back to what git says
        syncOptions:
          - CreateNamespace=true