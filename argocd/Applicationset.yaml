# Manage staging + prod with ArgoCD

apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: asyncvtp
  namespace: argocd
spec:
  generators:
    - list:
        elements:
          - env: staging
            namespace: asyncvtp-staging
            valuesFile: values-staging.yaml
          - env: prod
            namespace: asyncvtp-prod
            valuesFile: values-prod.yaml
  template:
    metadata:
      name: 'asyncvtp-{{env}}'
    spec:
      project: default
      source:
        repoURL: https://github.com/SIU1006/Piroo.git
        targetRevision: main
        path: k8s
        helm:
          valueFiles:
            - values.yaml
            - '{{valuesFile}}'
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{namespace}}'
      ignoreDifferences:
        # staging and prod both deploy the same chart into one cluster, so the
        # shared cluster-scoped resources (RBAC + the external-metrics APIService)
        # only differ by their per-release labels / target namespace. Ignore that
        # so the two apps don't ping-pong each other into a permanent OutOfSync.
        - group: apiregistration.k8s.io
          kind: APIService
          jsonPointers:
            - /metadata/labels
            - /spec/service/namespace
        - group: rbac.authorization.k8s.io
          kind: ClusterRole
          jsonPointers:
            - /metadata/labels
        - group: rbac.authorization.k8s.io
          kind: ClusterRoleBinding
          jsonPointers:
            - /metadata/labels
      syncPolicy:
        automated:
          prune: true    # remove resources that were deleted from the chart
          selfHeal: true  # revert manual kubectl edits back to what git says
        syncOptions:
          - CreateNamespace=true