<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Video Pipeline Tester</title>
<style>
  :root{
    --bg: #000000;
    --panel: #0a0a0a;
    --line: #2a2a2a;
    --line-active: #4a4a4a;
    --text: #e8e8e8;
    --text-dim: #757575;
    --accent: #4ade80;
    --accent-dim: #1f2e23;
    --error: #f87171;
  }

  * { box-sizing: border-box; }

  body{
    background: var(--bg);
    color: var(--text);
    font-family: 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace;
    min-height: 100vh;
    margin: 0;
    padding: 48px 24px;
    display: flex;
    justify-content: center;
  }

  .wrap{
    width: 100%;
    max-width: 640px;
  }

  .header{
    margin-bottom: 32px;
  }

  .eyebrow{
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin: 0 0 6px;
  }

  h1{
    font-size: 18px;
    font-weight: 500;
    margin: 0;
    letter-spacing: 0.01em;
  }

  .input-row{
    display: flex;
    gap: 10px;
    margin-bottom: 32px;
  }

  input[type="text"]{
    flex: 1;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    color: var(--text);
    padding: 12px 14px;
    font-family: inherit;
    font-size: 13px;
    outline: none;
    transition: border-color 0.15s ease;
    min-width: 0;
  }

  input[type="text"]::placeholder{
    color: var(--text-dim);
  }

  input[type="text"]:focus{
    border-color: var(--line-active);
  }

  button{
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    color: var(--text);
    padding: 12px 18px;
    font-family: inherit;
    font-size: 13px;
    cursor: pointer;
    white-space: nowrap;
    transition: border-color 0.15s ease, color 0.15s ease;
  }

  button:hover{
    border-color: var(--line-active);
  }

  button:active{
    transform: translateY(1px);
  }

  button:focus-visible,
  input:focus-visible{
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .box{
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 20px;
    margin-bottom: 20px;
  }

  .box-label{
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin: 0 0 14px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .dot{
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--text-dim);
    flex-shrink: 0;
  }

  .dot.pending{ background: var(--text-dim); }
  .dot.active{
    background: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-dim);
    animation: pulse 1.4s ease-in-out infinite;
  }
  .dot.done{ background: var(--accent); }
  .dot.error{ background: var(--error); }

  @keyframes pulse{
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  .stage-text{
    font-size: 14px;
    color: var(--text);
    margin: 0;
    min-height: 20px;
  }

  .stage-text.empty{
    color: var(--text-dim);
  }

  .summary-text{
    font-size: 13px;
    line-height: 1.65;
    color: var(--text);
    margin: 0;
    white-space: pre-wrap;
    word-break: break-word;
    min-height: 20px;
  }

  .summary-text.empty{
    color: var(--text-dim);
  }

  .meta{
    font-size: 11px;
    color: var(--text-dim);
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px solid var(--line);
  }

  .meta span{ color: var(--text); }
</style>
</head>
<body>
  <div class="wrap">
    <div class="header">
      <p class="eyebrow">Internal Tool</p>
      <h1>Video Pipeline Tester</h1>
    </div>

    <div class="input-row">
      <input type="text" id="task_id" placeholder="Paste task_id here" />
      <button onclick="connect()">Connect</button>
    </div>

    <div class="box">
      <p class="box-label"><span class="dot pending" id="stage_dot"></span>Stage</p>
      <p class="stage-text empty" id="stage_text">Not connected</p>
    </div>

    <div class="box">
      <p class="box-label"><span class="dot pending" id="summary_dot"></span>Result</p>
      <p class="summary-text empty" id="summary_text">Waiting for task result</p>
      <div class="meta" id="meta" style="display:none">
        task_id: <span id="meta_task_id"></span>
      </div>
    </div>
  </div>

  <script>
    function setStage(text, state){
      const dot = document.getElementById("stage_dot");
      const el = document.getElementById("stage_text");
      dot.className = "dot " + state;
      el.textContent = text;
      el.classList.remove("empty");
    }

    function setSummary(text, state, taskId){
      const dot = document.getElementById("summary_dot");
      const el = document.getElementById("summary_text");
      dot.className = "dot " + state;
      el.textContent = text;
      el.classList.remove("empty");
      if (taskId){
        document.getElementById("meta").style.display = "block";
        document.getElementById("meta_task_id").textContent = taskId;
      }
    }

    function connect() {
      const task_id = document.getElementById("task_id").value;
      if (!task_id) {
        setStage("Enter a task_id first", "error");
        return;
      }

      setStage("Connecting…", "active");

      const ws = new WebSocket(`ws://localhost:8000/api/v1/ws/${task_id}`);

      ws.onopen = () => setStage("Connected. Waiting for result…", "active");

      ws.onmessage = (event) => {
        let data;
        try {
          data = JSON.parse(event.data);
        } catch (e) {
          setSummary(event.data, "done");
          return;
        }

        if (data.status) {
          setStage(data.status === "completed" ? "Completed" : data.status, "done");
        }
        if (data.summary) {
          setSummary(data.summary, "done", data.task_id);
        } else if (!data.summary && data.status) {
          // status-only message, no summary yet
        }
      };

      ws.onclose = () => {
        const dot = document.getElementById("stage_dot");
        if (!dot.classList.contains("done") && !dot.classList.contains("error")) {
          setStage("Connection closed", "pending");
        }
      };

      ws.onerror = () => setStage("Connection error", "error");
    }
  </script>
</body>
</html>
