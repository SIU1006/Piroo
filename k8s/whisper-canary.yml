apiVersion: apps/v1
kind: Deployment
metadata:
  name: whisper-canary
spec:
  replicas: 1     
  selector:
    matchLabels:
      app: whisper
      track: canary
  template:
    metadata:
      labels:
        app: whisper
        track: canary
    spec:
      containers:
      - name: whisper
        image: asyncvtp-whisper-service:latest
        imagePullPolicy: Never
        envFrom:
        - configMapRef:
            name: pipeline-config
        env:
        - name: WHISPER_MODEL_SIZE
          value: "small"    
        ports:
        - containerPort: 3000
        volumeMounts:
        - name: uploads-storage
          mountPath: /app/uploads

        startupProbe:
          httpGet:
            path: /healthz
            port: 3000
          periodSeconds: 10
          failureThreshold: 30    # 5 mins for model download + load
        livenessProbe:
          httpGet:
            path: /healthz
            port: 3000
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /readyz
            port: 3000
          periodSeconds: 10

        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "2000m"


      volumes:
      - name: uploads-storage
        persistentVolumeClaim:
          claimName: uploads-pvc