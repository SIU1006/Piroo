apiVersion: apps/v1
kind: Deployment
metadata:
  name: fastapi

spec:
  replicas: 1
  selector:
    matchLabels:
      app: fastapi

  template:
    metadata:
      labels:
        app: fastapi

    spec:
      containers:
      - name: fastapi
        image: asyncvtp-fastapi:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8000
        envFrom:
        - configMapRef:
            name: pipeline-config
        volumeMounts:
        - name: uploads-storage
          mountPath: /app/uploads
          
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 3
          periodSeconds: 5

        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"

      volumes:
      - name: uploads-storage
        persistentVolumeClaim:
          claimName: uploads-pvc

---

apiVersion: v1
kind: Service
metadata:
  name: fastapi-service
spec:
  type: NodePort
  selector:
    app: fastapi

  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30000