apiVersion: apps/v1
kind: Deployment # Only Deployment cuz no other pod talks to it
metadata:
  name: celery

spec:
  replicas: 1
  selector:
    matchLabels:
      app: celery

  template:
    metadata:
      labels:
        app: celery
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9808"

    spec:
      containers:
      - name: celery
        image: asyncvtp-celery:latest
        imagePullPolicy: Never
        command: ["python", "-m", "celery"]
        # threads pool (not solo/prefork): the pipeline is I/O-bound (each task
        # blocks on HTTP calls to Whisper + Ollama for ~90% of its wall time), so
        # CPU-based scaling and process pools waste capacity. 4 threads let one pod
        # overlap several in-flight tasks while keeping the single-process metrics
        # server intact.
        args: ["-A", "worker.tasks", "worker", "--loglevel=info", "--pool=threads", "--concurrency=4"]
        envFrom:
        - configMapRef:
            name: pipeline-config
        env:
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: redis-secret
              key: redis-password
        ports:
        - containerPort: 9808
        volumeMounts:
        - name: uploads-storage
          mountPath: /app/uploads
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
      volumes:
      - name: uploads-storage
        persistentVolumeClaim:
          claimName: uploads-pvc