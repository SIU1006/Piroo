apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-adapter-config
data:
  config.yml: |
    # Maps a plain PromQL query to a metric HPA can target via the external.metrics.k8s.io API.
    externalRules:
      - seriesQuery: 'redis_key_size{key="celery"}'
        resources:
          overrides: {}
        name:
          matches: "redis_key_size"
          as: "celery_queue_depth"
        metricsQuery: 'redis_key_size{key="celery"}'
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus-adapter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus-adapter
  template:
    metadata:
      labels:
        app: prometheus-adapter
    spec:
      serviceAccountName: prometheus-adapter
      containers:
      - name: prometheus-adapter
        image: registry.k8s.io/prometheus-adapter/prometheus-adapter:v0.12.0
        args:
          - --secure-port=6443
          - --cert-dir=/tmp/cert
          - --prometheus-url=http://prometheus-service:9090
          - --metrics-relist-interval=30s
          - --config=/etc/adapter/config.yml
        ports:
        - containerPort: 6443
        volumeMounts:
        - name: config
          mountPath: /etc/adapter
        - name: tls-certs
          mountPath: /tmp/cert
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "200m"
      volumes:
      - name: config
        configMap:
          name: prometheus-adapter-config
      - name: tls-certs
        secret:
          # created by k8s/generate-adapter-certs.sh
          secretName: cm-adapter-serving-certs
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus-adapter-service
spec:
  selector:
    app: prometheus-adapter
  ports:
    - port: 443
      targetPort: 6443
---
# Registers the adapter with the API aggregation layer
apiVersion: apiregistration.k8s.io/v1
kind: APIService
metadata:
  name: v1beta1.external.metrics.k8s.io
spec:
  service:
    name: prometheus-adapter-service
    namespace: default
    port: 443
  group: external.metrics.k8s.io
  version: v1beta1
  insecureSkipTLSVerify: false
  caBundle: ""
  groupPriorityMinimum: 100
  versionPriority: 100