# Prod overlay — real cluster, pinned image tags, production capacity.
#   helm install asyncvtp . -f values.yaml -f values-prod.yaml \
#     --set global.imageRegistry=ghcr.io/your-org \
#     --set fastapi.image.tag=v1.4.2 --set celery.image.tag=v1.4.2 \
#     --set celeryBeat.image.tag=v1.4.2 --set whisper.image.tag=v1.4.2

global:
  imageRegistry: "ghcr.io/siu1006" # rewrite
  imagePullPolicy: Always

secrets:
  redis:
    create: false
    name: redis-secret
    key: redis-password
  grafana:
    create: false
    name: grafana-secret
    key: admin-password
  alertmanager:
    create: false
    name: alertmanager-secret
    key: slack-webhook-url

persistence:
  uploads:
    size: 100Gi
    storageClass: "standard"
  mlflow:
    size: 20Gi
    storageClass: "standard"
  redis:
    size: 5Gi
    storageClass: "standard"
  ollama:
    size: 20Gi
    storageClass: "standard"

fastapi:
  replicaCount: 3
  image:
    tag: "24d8fd853b63e8ac788fb4ea8f40f5200f8e738a"  # bump via PR after verifying this SHA in staging
  service:
    type: ClusterIP
    nodePort: null
  resources:
    requests:
      memory: 256Mi
      cpu: 200m
    limits:
      memory: 1Gi
      cpu: 1000m

celery:
  replicaCount: 3
  image:
    tag: "24d8fd853b63e8ac788fb4ea8f40f5200f8e738a"  # bump via PR after verifying this SHA in staging
  hpa:
    enabled: true
    minReplicas: 3
    maxReplicas: 15
  resources:
    requests:
      memory: 1Gi
      cpu: 500m
    limits:
      memory: 2Gi
      cpu: 2000m

celeryBeat:
  image:
    tag: "24d8fd853b63e8ac788fb4ea8f40f5200f8e738a"  # bump via PR after verifying this SHA in staging

whisper:
  image:
    tag: "24d8fd853b63e8ac788fb4ea8f40f5200f8e738a"  # bump via PR after verifying this SHA in staging
  canary:
    enabled: false # enable deliberately per-rollout, never left on by default
  resources:
    requests:
      memory: 1Gi
      cpu: 1000m
    limits:
      memory: 4Gi
      cpu: 4000m

ollama:
  resources:
    requests:
      memory: 4Gi
      cpu: 1000m
    limits:
      memory: 8Gi
      cpu: 4000m

prometheus:
  service:
    type: ClusterIP
    nodePort: null
  resources:
    requests:
      memory: 512Mi
      cpu: 250m
    limits:
      memory: 1Gi
      cpu: 1000m

grafana:
  service:
    type: ClusterIP
    nodePort: null

alertmanager:
  service:
    type: ClusterIP
    nodePort: null

mlflow:
  service:
    type: ClusterIP
    nodePort: null

prometheusAdapter:
  enabled: true
