apiVersion: apps/v1
kind: Deployment
metadata:
  name: whisper
spec:
  replicas: 9 
  selector:
    matchLabels:
      app: whisper
  template:
    metadata:
      labels:
        app: whisper
    spec:
      containers:
      - name: whisper
        image: asyncvtp-whisper-service:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 3000
        envFrom:
        - configMapRef:
            name: pipeline-config
        volumeMounts:
        - name: uploads-storage
          mountPath: /app/uploads

        startupProbe:
          httpGet:
            path: /healthz
            port: 3000
          periodSeconds: 10
          failureThreshold: 30
        livenessProbe:
          httpGet:
            path: /healthz
            port: 3000
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /readyz
            port: 3000
          periodSeconds: 10
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "2000m"   

      volumes:
      - name: uploads-storage
        persistentVolumeClaim:
          claimName: uploads-pvc

---

apiVersion: v1
kind: Service
metadata:
  name: whisper-service
spec:
  selector:
    app: whisper
  ports:
    - port: 3000
      targetPort: 3000