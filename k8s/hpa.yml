apiVersion: autoscaling/v2 # v2 supports type: Resources & target in metrics block
kind: HorizontalPodAutoscaler
metadata:
  name: celery-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: celery
  minReplicas: 1
  maxReplicas: 5
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70

  # Requires prometheus-adapter (k8s/prometheus-adapter.yml) to be deployed and its TLS certs generated first, or this metric simply won't resolve and HPA falls back to CPU alone.
  - type: External
    external:
      metric:
        name: celery_queue_depth
      target:
        type: AverageValue # scale so each replica carries ~5 queued tasks
        averageValue: "5"