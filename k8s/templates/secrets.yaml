{{/*
These Secret resources are ONLY rendered when secrets.<name>.create is true.
This exists purely for local/dev convenience (values-dev.yaml sets create:
true with a throwaway value). Staging and prod set create: false and expect
the named Secret to already exist in-cluster, provisioned by a proper
secrets pipeline (sealed-secrets, External Secrets Operator, CI/CD vault
injection, etc.) — never by committing real values into values files.
*/}}
{{- if .Values.secrets.redis.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secrets.redis.name }}
  labels:
    {{- include "asyncvtp.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.secrets.redis.key }}: {{ .Values.secrets.redis.value | quote }}
---
{{- end }}
{{- if .Values.secrets.grafana.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secrets.grafana.name }}
  labels:
    {{- include "asyncvtp.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.secrets.grafana.key }}: {{ .Values.secrets.grafana.value | quote }}
---
{{- end }}
{{- if .Values.secrets.alertmanager.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secrets.alertmanager.name }}
  labels:
    {{- include "asyncvtp.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.secrets.alertmanager.key }}: {{ .Values.secrets.alertmanager.value | quote }}
{{- end }}
