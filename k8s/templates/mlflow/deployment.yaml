apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlflow
  labels:
    app: mlflow
    {{- include "asyncvtp.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate # avoid two pods fighting over the same ReadWriteOnce PVC during a rollout
  selector:
    matchLabels:
      app: mlflow
  template:
    metadata:
      labels:
        app: mlflow
    spec:
      containers:
      - name: mlflow
        image: "{{ .Values.mlflow.image.repository }}:{{ .Values.mlflow.image.tag }}"
        command: ["mlflow", "server"]
        args:
          - "--host"
          - "0.0.0.0"
          - "--port"
          - "5000"
          - "--backend-store-uri"
          - "sqlite:////mlflow/mlflow.db"
          - "--default-artifact-root"
          - "/mlflow/artifacts"
        ports:
        - containerPort: 5000
        volumeMounts:
        - name: mlflow-storage
          mountPath: /mlflow
        {{- if .Values.mlflow.resources }}
        resources:
          {{- toYaml .Values.mlflow.resources | nindent 10 }}
        {{- end }}
      volumes:
      - name: mlflow-storage
        persistentVolumeClaim:
          claimName: mlflow-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: mlflow-service
  labels:
    app: mlflow
    {{- include "asyncvtp.labels" . | nindent 4 }}
spec:
  type: {{ .Values.mlflow.service.type }}
  selector:
    app: mlflow
  ports:
    - port: {{ .Values.mlflow.service.port }}
      targetPort: {{ .Values.mlflow.service.port }}
      {{- if and (eq .Values.mlflow.service.type "NodePort") .Values.mlflow.service.nodePort }}
      nodePort: {{ .Values.mlflow.service.nodePort }}
      {{- end }}
