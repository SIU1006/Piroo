apiVersion: apps/v1
kind: Deployment
metadata:
  name: celery-beat
  labels:
    app: celery-beat
    {{- include "asyncvtp.labels" . | nindent 4 }}
spec:
  replicas: 1 # Must not change
  selector:
    matchLabels:
      app: celery-beat
  template:
    metadata:
      labels:
        app: celery-beat
    spec:
      containers:
      - name: celery-beat
        image: {{ include "asyncvtp.image" (dict "image" .Values.celeryBeat.image "root" $) }}
        imagePullPolicy: {{ .Values.global.imagePullPolicy }}
        command: ["python", "-m", "celery"]
        args: ["-A", "worker.tasks", "beat", "--loglevel=info"]
        envFrom:
        - configMapRef:
            name: pipeline-config
        env:
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ .Values.secrets.redis.name }}
              key: {{ .Values.secrets.redis.key }}
        resources:
          {{- toYaml .Values.celeryBeat.resources | nindent 10 }}
