apiVersion: apps/v1
kind: Deployment
metadata:
  name: celery-beat
  labels:
    app: celery-beat
    {{- include "asyncvtp.labels" . | nindent 4 }}
spec:
  replicas: 1 # Must not change
  selector:
    matchLabels:
      app: celery-beat
  template:
    metadata:
      annotations:
        checksum/pipeline-config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/object-storage-secrets: {{ include "asyncvtp.objectStorageSecretChecksum" . }}
      labels:
        app: celery-beat
    spec:
      serviceAccountName: asyncvtp-uploads
      containers:
      - name: celery-beat
        image: {{ include "asyncvtp.image" (dict "image" .Values.celeryBeat.image "root" $) }}
        imagePullPolicy: {{ .Values.global.imagePullPolicy }}
        command: ["python", "-m", "celery"]
        args: ["-A", "worker.tasks", "beat", "--loglevel=info", "--schedule=/tmp/celerybeat-schedule"]
        envFrom:
        - configMapRef:
            name: pipeline-config
        {{- if .Values.objectStorage.credentialsSecret }}
        - secretRef:
            name: {{ .Values.objectStorage.credentialsSecret }}
        {{- end }}
        env:
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ .Values.secrets.redis.name }}
              key: {{ .Values.secrets.redis.key }}
        resources:
          {{- toYaml .Values.celeryBeat.resources | nindent 10 }}
        {{- if .Values.objectStorage.caSecret }}
        volumeMounts:
          {{- include "asyncvtp.objectStorageCaMount" . | nindent 8 }}
      volumes:
        {{- include "asyncvtp.objectStorageCaVolume" . | nindent 6 }}
        {{- end }}
