{{- if .Values.celery.hpa.enabled }}
apiVersion: autoscaling/v2 # v2 supports type: Resources & target in metrics block
kind: HorizontalPodAutoscaler
metadata:
  name: celery-hpa
  labels:
    {{- include "asyncvtp.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: celery
  minReplicas: {{ .Values.celery.hpa.minReplicas }}
  maxReplicas: {{ .Values.celery.hpa.maxReplicas }}
  metrics:
  # Load testing showed Celery workers are I/O-bound (they block ~90% of wall
  # time on HTTP calls to Whisper + Ollama), so their CPU sits at ~5-20m and the
  # CPU target below essentially never fires. It is kept only as a coarse
  # fallback. Queue depth is the signal that actually correlates with the backlog.
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: {{ .Values.celery.hpa.cpuTargetPercent }}

  # The effective scaling signal: number of tasks waiting in the Redis broker
  # (`redis_key_size{key="celery"}`). Requires prometheusAdapter enabled + its
  # TLS certs generated, or this metric won't resolve and HPA falls back to CPU alone.
  - type: External
    external:
      metric:
        name: celery_queue_depth
      target:
        type: AverageValue # scale so each replica carries ~N queued tasks
        averageValue: {{ .Values.celery.hpa.queueDepthTarget | quote }}
{{- end }}
