apiVersion: apps/v1
kind: Deployment # Only Deployment cuz no other pod talks to it
metadata:
  name: celery
  labels:
    app: celery
    {{- include "asyncvtp.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.celery.replicaCount }}
  selector:
    matchLabels:
      app: celery
  template:
    metadata:
      labels:
        app: celery
      annotations:
        checksum/pipeline-config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ .Values.celery.metricsPort | quote }}
    spec:
      serviceAccountName: asyncvtp-uploads
      securityContext:
        # Private scratch space; source uploads live in object storage.
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      containers:
      - name: celery
        image: {{ include "asyncvtp.image" (dict "image" .Values.celery.image "root" $) }}
        imagePullPolicy: {{ .Values.global.imagePullPolicy }}
        command: ["python", "-m", "celery"]
        # threads pool
        args: ["-A", "worker.tasks", "worker", "--loglevel=info", "--pool=threads", "--concurrency={{ .Values.celery.concurrency }}"]
        envFrom:
        - configMapRef:
            name: pipeline-config
        {{- if .Values.objectStorage.credentialsSecret }}
        - secretRef:
            name: {{ .Values.objectStorage.credentialsSecret }}
        {{- end }}
        env:
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ .Values.secrets.redis.name }}
              key: {{ .Values.secrets.redis.key }}
        ports:
        - containerPort: {{ .Values.celery.metricsPort }}
        volumeMounts:
        - name: uploads-storage
          mountPath: /app/uploads
        resources:
          {{- toYaml .Values.celery.resources | nindent 10 }}
      volumes:
      - name: uploads-storage
        emptyDir:
          sizeLimit: {{ .Values.objectStorage.scratchSize }}
