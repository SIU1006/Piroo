{{- if .Values.alertmanager.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  labels:
    {{- include "asyncvtp.labels" . | nindent 4 }}
data:
  alertmanager.yml: |
    global:
      resolve_timeout: 5m

    route:
      receiver: {{ ternary "slack" "local" .Values.alertmanager.notifications.enabled | quote }}
      group_by: ['alertname']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h

    receivers:
      - name: 'local'
      {{- if .Values.alertmanager.notifications.enabled }}
      - name: 'slack'
        slack_configs:
          - api_url_file: /etc/alertmanager/secrets/slack-webhook-url
            channel: {{ .Values.alertmanager.slackChannel | quote }}
            send_resolved: true
            title: {{`'{{ .CommonAnnotations.summary }}'`}}
            text: {{`'{{ .CommonAnnotations.description }}'`}}
      {{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager
  labels:
    app: alertmanager
    {{- include "asyncvtp.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alertmanager
  template:
    metadata:
      labels:
        app: alertmanager
      annotations:
        checksum/config: {{ toJson .Values.alertmanager | sha256sum }}
    spec:
      containers:
      - name: alertmanager
        image: "{{ .Values.alertmanager.image.repository }}:{{ .Values.alertmanager.image.tag }}"
        ports:
        - containerPort: 9093
        volumeMounts:
        - name: config
          mountPath: /etc/alertmanager/alertmanager.yml
          subPath: alertmanager.yml
        {{- if .Values.alertmanager.notifications.enabled }}
        - name: slack-secret
          mountPath: /etc/alertmanager/secrets
          readOnly: true
        {{- end }}

        resources:
          {{- toYaml .Values.alertmanager.resources | nindent 10 }}

      volumes:
      - name: config
        configMap:
          name: alertmanager-config
      {{- if .Values.alertmanager.notifications.enabled }}
      - name: slack-secret
        secret:
          secretName: {{ .Values.secrets.alertmanager.name }}
          items:
            - key: {{ .Values.secrets.alertmanager.key }}
              path: slack-webhook-url
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: alertmanager-service
  labels:
    app: alertmanager
    {{- include "asyncvtp.labels" . | nindent 4 }}
spec:
  type: {{ .Values.alertmanager.service.type }}
  selector:
    app: alertmanager
  ports:
    - port: {{ .Values.alertmanager.service.port }}
      targetPort: {{ .Values.alertmanager.service.port }}
      {{- if and (eq .Values.alertmanager.service.type "NodePort") .Values.alertmanager.service.nodePort }}
      nodePort: {{ .Values.alertmanager.service.nodePort }}
      {{- end }}
{{- end }}
