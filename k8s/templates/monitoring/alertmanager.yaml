{{- if .Values.alertmanager.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  labels:
    {{- include "asyncvtp.labels" . | nindent 4 }}
data:
  alertmanager.yml: |
{{ include "asyncvtp.alertmanagerConfig" . | indent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager
  labels:
    app: alertmanager
    {{- include "asyncvtp.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alertmanager
  template:
    metadata:
      labels:
        app: alertmanager
      annotations:
        checksum/config: {{ include "asyncvtp.alertmanagerConfig" . | sha256sum }}
    spec:
      containers:
      - name: alertmanager
        image: "{{ .Values.alertmanager.image.repository }}:{{ .Values.alertmanager.image.tag }}"
        ports:
        - containerPort: 9093
        volumeMounts:
        - name: config
          mountPath: /etc/alertmanager/alertmanager.yml
          subPath: alertmanager.yml
        {{- if .Values.alertmanager.notifications.enabled }}
        - name: slack-secret
          mountPath: /etc/alertmanager/secrets
          readOnly: true
        {{- end }}

        resources:
          {{- toYaml .Values.alertmanager.resources | nindent 10 }}

      volumes:
      - name: config
        configMap:
          name: alertmanager-config
      {{- if .Values.alertmanager.notifications.enabled }}
      - name: slack-secret
        secret:
          secretName: {{ .Values.secrets.alertmanager.name }}
          items:
            - key: {{ .Values.secrets.alertmanager.key }}
              path: slack-webhook-url
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: alertmanager-service
  labels:
    app: alertmanager
    {{- include "asyncvtp.labels" . | nindent 4 }}
spec:
  type: {{ .Values.alertmanager.service.type }}
  selector:
    app: alertmanager
  ports:
    - port: {{ .Values.alertmanager.service.port }}
      targetPort: {{ .Values.alertmanager.service.port }}
      {{- if and (eq .Values.alertmanager.service.type "NodePort") .Values.alertmanager.service.nodePort }}
      nodePort: {{ .Values.alertmanager.service.nodePort }}
      {{- end }}
{{- end }}
