{{- if .Values.prometheusAdapter.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-adapter-config
  labels:
    {{- include "asyncvtp.labels" . | nindent 4 }}
data:
  config.yml: |
    # Maps a plain PromQL query to a metric HPA can target via the external.metrics.k8s.io API.
    externalRules:
      - seriesQuery: '{__name__="redis_key_size",key="celery"}'
        resources:
          overrides:
            namespace:
              resource: namespace
        name:
          matches: "redis_key_size"
          as: "celery_queue_depth"
        metricsQuery: 'redis_key_size{key="celery",<<.LabelMatchers>>}'
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus-adapter
  labels:
    app: prometheus-adapter
    {{- include "asyncvtp.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus-adapter
  template:
    metadata:
      labels:
        app: prometheus-adapter
    spec:
      serviceAccountName: prometheus-adapter
      containers:
      - name: prometheus-adapter
        image: "{{ .Values.prometheusAdapter.image.repository }}:{{ .Values.prometheusAdapter.image.tag }}"
        args:
          - --secure-port=6443
          - --cert-dir=/tmp/cert
          - --prometheus-url=http://prometheus-service:9090
          - --metrics-relist-interval=30s
          - --config=/etc/adapter/config.yml
        ports:
        - containerPort: 6443
        volumeMounts:
        - name: config
          mountPath: /etc/adapter
        - name: tls-certs
          mountPath: /tmp/cert
        resources:
          {{- toYaml .Values.prometheusAdapter.resources | nindent 10 }}
      volumes:
      - name: config
        configMap:
          name: prometheus-adapter-config
      - name: tls-certs
        secret:
          # created out-of-band, e.g. via k8s/generate_adapter_certs.sh — see NOTES.txt
          secretName: cm-adapter-serving-certs
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus-adapter-service
  labels:
    app: prometheus-adapter
    {{- include "asyncvtp.labels" . | nindent 4 }}
spec:
  selector:
    app: prometheus-adapter
  ports:
    - port: 443
      targetPort: 6443
---
# Registers the adapter with the API aggregation layer
apiVersion: apiregistration.k8s.io/v1
kind: APIService
metadata:
  name: v1beta1.external.metrics.k8s.io
  labels:
    {{- include "asyncvtp.labels" . | nindent 4 }}
spec:
  service:
    name: prometheus-adapter-service
    namespace: {{ .Release.Namespace }}
  group: external.metrics.k8s.io
  version: v1beta1
  # The adapter serves a self-signed cert (cm-adapter-serving-certs). Skipping
  # verification keeps the aggregated API reachable without a per-cluster CA.
  # Production should sign the serving cert with a real CA and set caBundle.
  insecureSkipTLSVerify: true
  caBundle: ""
  groupPriorityMinimum: 100
  versionPriority: 100
{{- end }}
