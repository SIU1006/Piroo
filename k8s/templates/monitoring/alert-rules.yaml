{{- if .Values.prometheus.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-alert-rules
  labels:
    {{- include "asyncvtp.labels" . | nindent 4 }}
data:
  asyncvtp.rules.yml: |
    groups:
      - name: asyncvtp-slos
        rules:
          # Execution time starts when a worker accepts a task. Queue wait is
          # measured separately from this histogram.
          - alert: ProcessVideoLatencySLOBreach
            expr: |
              histogram_quantile(0.95,
                sum(rate(celery_task_duration_seconds_bucket{task_name="process_video",video_length_bucket="under_10min",namespace="{{ .Release.Namespace }}"}[1h])) by (le)
              ) > 120
            for: 15m
            labels:
              severity: warning
              namespace: {{ .Release.Namespace | quote }}
            annotations:
              summary: "Sub-10-minute video execution p95 exceeds 2 minutes"
              description: "Worker execution p95 has exceeded 120s for 15 minutes. This excludes time waiting in the queue."

          - alert: TaskFailureRateSLOBreach
            expr: |
              sum(rate(celery_task_total{task_name="process_video",status="failure",namespace="{{ .Release.Namespace }}"}[1h]))
              /
              clamp_min(sum(rate(celery_task_total{task_name="process_video",status=~"success|failure",namespace="{{ .Release.Namespace }}"}[1h])), 0.000001)
              > 0.01
            for: 15m
            labels:
              severity: warning
              namespace: {{ .Release.Namespace | quote }}
            annotations:
              summary: "Video processing failure rate exceeds 1%"
              description: "More than 1% of completed video tasks failed in the last hour. Interim retry attempts are excluded."

          # The beat task can execute on any Celery replica. Select the worker
          # with the latest successful check, rather than a stale gauge on a
          # different replica.
          - alert: CanaryWERSLOBreach
            expr: |
              (
                canary_wer{app="celery",namespace="{{ .Release.Namespace }}"}
                and on(pod,namespace)
                topk(1, canary_last_success_timestamp_seconds{app="celery",namespace="{{ .Release.Namespace }}"})
              ) > 0.05
            for: 30m
            labels:
              severity: critical
              namespace: {{ .Release.Namespace | quote }}
            annotations:
              summary: "Canary word error rate exceeds 0.05"
              description: "The latest successful synthetic transcription check has exceeded the quality threshold for 30 minutes."

          # A gauge stays available even when no new checks run. Its timestamp
          # shows freshness; vector(0) also detects a missing worker series.
          - alert: CanaryCheckNotRunning
            expr: |
              time() - (
                max(canary_last_success_timestamp_seconds{app="celery",namespace="{{ .Release.Namespace }}"} > 0)
                or min(celery_worker_start_timestamp_seconds{app="celery",namespace="{{ .Release.Namespace }}"})
                or vector(0)
              ) > 7200
            for: 5m
            labels:
              severity: warning
              namespace: {{ .Release.Namespace | quote }}
            annotations:
              summary: "No successful canary transcription in 2 hours"
              description: "The hourly check has not succeeded recently, or its Celery metrics are unavailable."
          {{- if .Values.prometheus.smokeAlert.enabled }}
          # Opt-in exercise of the entire Prometheus -> Alertmanager path.
          # Use value=1 to fire and value=0 to resolve in a local environment.
          - alert: AsyncVTPSmokeAlert
            expr: vector({{ .Values.prometheus.smokeAlert.value }}) > 0
            for: 0m
            labels:
              severity: info
              namespace: {{ .Release.Namespace | quote }}
            annotations:
              summary: "Monitoring delivery smoke test"
              description: "Synthetic test alert for verifying Prometheus and Alertmanager routing."
          {{- end }}
{{- end }}
