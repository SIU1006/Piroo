apiVersion: apps/v1
kind: Deployment
metadata:
  name: fastapi
  labels:
    app: fastapi
    {{- include "asyncvtp.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.fastapi.replicaCount }}
  selector:
    matchLabels:
      app: fastapi
  template:
    metadata:
      labels:
        app: fastapi
      annotations:
        checksum/pipeline-config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
    spec:
      serviceAccountName: asyncvtp-uploads
      securityContext:
        # Private scratch space belongs to the non-root appuser.
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      containers:
      - name: fastapi
        image: {{ include "asyncvtp.image" (dict "image" .Values.fastapi.image "root" $) }}
        imagePullPolicy: {{ .Values.global.imagePullPolicy }}
        ports:
        - containerPort: 8000
        envFrom:
        - configMapRef:
            name: pipeline-config
        {{- if .Values.objectStorage.credentialsSecret }}
        - secretRef:
            name: {{ .Values.objectStorage.credentialsSecret }}
        {{- end }}
        env:
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ .Values.secrets.redis.name }}
              key: {{ .Values.secrets.redis.key }}
        volumeMounts:
        - name: uploads-storage
          mountPath: /app/uploads

        livenessProbe:
          httpGet:
            path: /healthz
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8000
          initialDelaySeconds: 3
          periodSeconds: 5

        resources:
          {{- toYaml .Values.fastapi.resources | nindent 10 }}

      volumes:
      - name: uploads-storage
        emptyDir:
          sizeLimit: {{ .Values.objectStorage.scratchSize }}
---
apiVersion: v1
kind: Service
metadata:
  name: fastapi-service
  labels:
    app: fastapi
    {{- include "asyncvtp.labels" . | nindent 4 }}
spec:
  type: {{ .Values.fastapi.service.type }}
  selector:
    app: fastapi
  ports:
    - port: {{ .Values.fastapi.service.port }}
      targetPort: {{ .Values.fastapi.service.port }}
      {{- if and (eq .Values.fastapi.service.type "NodePort") .Values.fastapi.service.nodePort }}
      nodePort: {{ .Values.fastapi.service.nodePort }}
      {{- end }}
