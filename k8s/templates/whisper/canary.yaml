{{- if .Values.whisper.canary.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: whisper-canary
  labels:
    app: whisper
    track: canary
    {{- include "asyncvtp.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: whisper
      track: canary
  template:
    metadata:
      labels:
        app: whisper
        track: canary
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ .Values.whisper.service.port | quote }}
    spec:
      containers:
      - name: whisper
        image: {{ include "asyncvtp.image" (dict "image" .Values.whisper.canary.image "root" $) }}
        imagePullPolicy: {{ .Values.global.imagePullPolicy }}
        envFrom:
        - configMapRef:
            name: pipeline-config
        env:
        - name: WHISPER_MODEL_SIZE
          value: {{ .Values.whisper.canary.modelSize | quote }}
        ports:
        - containerPort: {{ .Values.whisper.service.port }}
        volumeMounts:
        - name: uploads-storage
          mountPath: /app/uploads

        startupProbe:
          httpGet:
            path: /healthz
            port: {{ .Values.whisper.service.port }}
          periodSeconds: 10
          failureThreshold: 12
        livenessProbe:
          httpGet:
            path: /healthz
            port: {{ .Values.whisper.service.port }}
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /readyz
            port: {{ .Values.whisper.service.port }}
          periodSeconds: 10

        resources:
          {{- toYaml .Values.whisper.resources | nindent 10 }}

      volumes:
      - name: uploads-storage
        persistentVolumeClaim:
          claimName: uploads-pvc
{{- end }}
