apiVersion: apps/v1
kind: Deployment
metadata:
  name: whisper
  labels:
    app: whisper
    {{- include "asyncvtp.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: whisper
  template:
    metadata:
      labels:
        app: whisper
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ .Values.whisper.service.port | quote }}
    spec:
      containers:
      - name: whisper
        image: {{ include "asyncvtp.image" (dict "image" .Values.whisper.image "root" $) }}
        imagePullPolicy: {{ .Values.global.imagePullPolicy }}
        ports:
        - containerPort: {{ .Values.whisper.service.port }}
        envFrom:
        - configMapRef:
            name: pipeline-config
        volumeMounts:
        - name: uploads-storage
          mountPath: /app/uploads

        startupProbe:
          httpGet:
            path: /healthz
            port: {{ .Values.whisper.service.port }}
          periodSeconds: 10
          failureThreshold: 12
        livenessProbe:
          httpGet:
            path: /healthz
            port: {{ .Values.whisper.service.port }}
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /readyz
            port: {{ .Values.whisper.service.port }}
          periodSeconds: 10
        resources:
          {{- toYaml .Values.whisper.resources | nindent 10 }}

      volumes:
      - name: uploads-storage
        persistentVolumeClaim:
          claimName: uploads-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: whisper-service
  labels:
    app: whisper
    {{- include "asyncvtp.labels" . | nindent 4 }}
spec:
  selector:
    app: whisper
  ports:
    - port: {{ .Values.whisper.service.port }}
      targetPort: {{ .Values.whisper.service.port }}
