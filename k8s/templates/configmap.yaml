apiVersion: v1
kind: ConfigMap
metadata:
  name: pipeline-config
  labels:
    {{- include "asyncvtp.labels" . | nindent 4 }}
data:
  BROKER_URL: {{ .Values.pipelineConfig.BROKER_URL | quote }}
  WHISPER_URL: {{ .Values.pipelineConfig.WHISPER_URL | quote }}
  CANARY_WHISPER_URL: {{ if .Values.whisper.canary.enabled }}"http://whisper-canary-service:{{ .Values.whisper.service.port }}"{{ else }}""{{ end }}
  CANARY_WHISPER_IMAGE: {{ if .Values.whisper.canary.enabled }}{{ include "asyncvtp.image" (dict "image" .Values.whisper.canary.image "root" $) | quote }}{{ else }}""{{ end }}
  OLLAMA_HOST: {{ .Values.pipelineConfig.OLLAMA_HOST | quote }}
  LLM_MODEL: {{ .Values.pipelineConfig.LLM_MODEL | quote }}
  UPLOAD_STORAGE_BACKEND: "s3"
  UPLOAD_DIR: "/app/uploads"
  S3_UPLOAD_BUCKET: {{ required "objectStorage.bucket is required" .Values.objectStorage.bucket | quote }}
  S3_ENDPOINT_URL: {{ .Values.objectStorage.endpoint | quote }}
  AWS_DEFAULT_REGION: {{ .Values.objectStorage.region | quote }}
  {{- if .Values.objectStorage.caSecret }}
  AWS_CA_BUNDLE: "/etc/asyncvtp/object-storage-ca/ca.crt"
  {{- end }}
  MAX_OUTSTANDING_TASKS: {{ .Values.admission.maxOutstanding | quote }}
  TASK_QUEUE_TIMEOUT_SECONDS: {{ .Values.admission.queueTimeoutSeconds | quote }}
  UPLOAD_TIMEOUT_SECONDS: {{ .Values.admission.uploadTimeoutSeconds | quote }}
