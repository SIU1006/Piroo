<!DOCTYPE html>
<html>
<body>
  <h2>Video Pipeline Tester</h2>
  <input type="text" id="task_id" placeholder="Paste task_id here" style="width:400px"/>
  <button onclick="connect()">Connect WebSocket</button>
  <pre id="output" style="background:#f0f0f0; padding:10px; margin-top:10px"></pre>

  <script>
    function connect() {
      const task_id = document.getElementById("task_id").value;
      const ws = new WebSocket(`ws://localhost:8000/api/v1/ws/${task_id}`);
      
      ws.onopen = () => log("Connected. Waiting for result...");
      ws.onmessage = (event) => log("Result: " + event.data);
      ws.onclose = () => log("Connection closed.");
      ws.onerror = (e) => log("Error: " + e);
    }

    function log(msg) {
      document.getElementById("output").textContent += msg + "\n";
    }
  </script>
</body>
</html>
