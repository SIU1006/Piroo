x-app-environment: &app-environment
  BROKER_URL: redis://redis:6379/0
  REDIS_PASSWORD: ${REDIS_PASSWORD:-change-me-dev-only}
  WHISPER_URL: http://whisper-service:3000
  OLLAMA_HOST: http://ollama:11434
  LLM_MODEL: ${LLM_MODEL:-llama3.2}
  UPLOAD_STORAGE_BACKEND: s3
  S3_UPLOAD_BUCKET: asyncvtp-uploads
  S3_ENDPOINT_URL: http://minio:9000
  AWS_DEFAULT_REGION: us-east-1
  AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-dev-only-minio}
  AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-dev-only-minio-password}
  MAX_OUTSTANDING_TASKS: ${MAX_OUTSTANDING_TASKS:-100}
  TASK_QUEUE_TIMEOUT_SECONDS: ${TASK_QUEUE_TIMEOUT_SECONDS:-600}
  UPLOAD_TIMEOUT_SECONDS: ${UPLOAD_TIMEOUT_SECONDS:-120}

services:
  redis:
    image: redis:7.4.10
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-change-me-dev-only}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-change-me-dev-only}
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck: # Make sure redis container ready
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 5

  fastapi:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment: *app-environment
    depends_on:
      object-storage-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      ollama-model:
        condition: service_completed_successfully
      whisper-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/readyz', timeout=5)"]
      interval: 10s
      timeout: 3s
      retries: 12

  celery:
    build: .
    command: python -m celery -A worker.tasks worker --loglevel=info --pool=solo
    environment: *app-environment
    depends_on:
      object-storage-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      ollama-model:
        condition: service_completed_successfully
      whisper-service:
        condition: service_healthy

  celery-beat:
    build: .
    command: python -m celery -A worker.tasks beat --loglevel=info --schedule=/tmp/celerybeat-schedule
    environment: *app-environment
    depends_on:
      redis:
        condition: service_healthy


  whisper-service:
    build:
      context: .
      dockerfile: Dockerfile.inference
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:3000/readyz', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 30
      start_period: 30s


  ollama:
    image: ollama/ollama:0.32.13
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 3s
      retries: 24

  ollama-model:
    image: ollama/ollama:0.32.13
    environment:
      OLLAMA_HOST: http://ollama:11434
    command: ["pull", "${LLM_MODEL:-llama3.2}"]
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

  minio:
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z@sha256:a1ea29fa28355559ef137d71fc570e508a214ec84ff8083e39bc5428980b015e
    command: [server, /data]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-dev-only-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-dev-only-minio-password}
    volumes:
      - object_storage_data:/data

  object-storage-init:
    build: .
    command: [python, -m, init_object_storage]
    environment: *app-environment
    depends_on:
      minio:
        condition: service_started
    restart: "no"

volumes: # storage outside any container
  ollama_data:
  object_storage_data:
