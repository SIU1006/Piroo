services:
  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck: # Make sure redis container ready
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  fastapi:
    build: .
    ports:
      - "8000:8000"
    environment:
      - BROKER_URL=redis://redis:6379/0
      - BACKEND_URL=redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
      ollama:
        condition: service_started

  celery:
    build: .
    command: python -m celery -A worker.tasks worker --loglevel=info --pool=solo
    environment:
      - BROKER_URL=redis://redis:6379/0
      - BACKEND_URL=redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
      ollama:
        condition: service_started

  ollama:
    image: ollama/ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

volumes:
  ollama_data: